name: Esteira de Qualidade Industrial

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Type-Check, Build & Motion Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Verification
        run: npx tsc -b

      - name: Production Vite Build & Code Splitting Validation
        run: npm run build

      - name: Performance & Bundle Budget Check
        run: |
          echo "Verificando orcamento de performance dos chunks..."
          test -f dist/index.html && echo "index.html gerado com sucesso."
          test -d dist/assets && echo "Chunks de código divididos por rota gerados com sucesso."
